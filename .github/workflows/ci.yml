
name: "CI — APSIA"

# Permissoes minimas necessarias (principio do privilegio minimo)
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
      - "refatoração"
  pull_request:
    branches:
      - main

# Cancela runs anteriores do mesmo PR/branch para economizar minutos de CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------
  # JOB 1 — Backend: TypeScript + Prisma
  # Node 22 LTS — alinhado ao frontend e ao ambiente local
  # -------------------------------------------------------
  ci-backend:
    name: "Backend — TypeScript & Prisma"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend_Papse

    env:
      # Placeholder para satisfazer o Prisma sem banco real
      DATABASE_URL: "mysql://ci_user:ci_pass@localhost:3306/ci_db"

    steps:
      - name: "Checkout do repositorio"
        uses: actions/checkout@v4

      - name: "Configurar Node.js 22 (LTS)"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Backend_Papse/package-lock.json

      - name: "Instalar dependencias"
        run: npm ci

      - name: "Gerar Prisma Client"
        run: npx prisma generate

      - name: "Validar schema do Prisma"
        run: npx prisma validate

      - name: "Compilar TypeScript (verificacao de tipos)"
        run: npx tsc --noEmit

  # -------------------------------------------------------
  # JOB 2 — Frontend: Build completo
  # Node 22 LTS
  # -------------------------------------------------------
  ci-frontend:
    name: "Frontend — TypeScript & Vite Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    env:
      VITE_API_URL: "http://localhost:3000/api"

    steps:
      - name: "Checkout do repositorio"
        uses: actions/checkout@v4

      - name: "Configurar Node.js 22 (LTS)"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: "Instalar dependencias"
        run: npm ci

      - name: "Build de producao (tsc + vite build)"
        run: npm run build

  # -------------------------------------------------------
  # JOB 3 — Docker: Validacao + Build das imagens (sem up)
  # Aguarda ci-backend e ci-frontend passarem antes de iniciar
  # -------------------------------------------------------
  ci-docker:
    name: "Docker — Validar e Build das imagens"
    runs-on: ubuntu-latest
    needs: [ci-backend, ci-frontend]

    env:
      # Variaveis minimas para expandir o docker-compose.yml sem erros
      DATABASE_URL: "mysql://ci_user:ci_pass@localhost:3306/ci_db"
      MYSQL_ROOT_PASSWORD: "ci_root"
      MYSQL_DATABASE: "ci_db"
      MYSQL_USER: "ci_user"
      MYSQL_PASSWORD: "ci_pass"
      JWT_SECRET: "ci_jwt_secret_placeholder_64chars_minimum_for_validation"
      VITE_API_URL: "http://localhost:3000/api"

    steps:
      - name: "Checkout do repositorio"
        uses: actions/checkout@v4

      - name: "Configurar Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Criar .env dummy"
        run: touch .env

      - name: "Validar configuracao do Docker Compose"
        run: docker compose config --quiet

      - name: "Build das imagens Docker (sem subir containers)"
        run: docker compose build
