services:
  app:
    container_name: api-papse
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql://root:supersecreto@db:3306/papse_db
      - JWT_SECRET=supersecreto
    dns:
      - 8.8.8.8
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db
    networks:
      - papse_network
  db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: supersecreto
      MYSQL_DATABASE: papse_db
      MYSQL_USER: docker_user
      MYSQL_PASSWORD: supersecreto
    restart: always
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - papse_network
networks:
  papse_network:
    external: true
volumes:
  mysql-data: